<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Particle Card</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="loading">
        <div class="loading-text">Loading hand tracking...</div>
        <div class="loading-spinner"></div>
    </div>
    
    <div id="instructions">
        <strong>🤏 Pinch fingers together</strong> to reveal the image<br>
        <strong>✋ Open palm</strong> to disperse particles<br>
        <small>Press 1 or 2 to switch images</small>
    </div>
    
    <video id="video" autoplay playsinline></video>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    
    <!-- Our Scripts -->
    <script src="js/config.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/imageLoader.js"></script>
    <script src="js/handTracking.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
