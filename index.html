<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Particle Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
        }
        
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid #ff69b4;
            border-radius: 10px;
            transform: scaleX(-1);
            z-index: 10;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff69b4;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
            max-width: 300px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff69b4;
            font-size: 24px;
            z-index: 100;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="loading">Loading hand tracking...</div>
    
    <div id="instructions">
        <strong>🤏 Pinch fingers together</strong> to reveal the image<br>
        <strong>✋ Open palm</strong> to disperse particles
    </div>
    
    <video id="video" autoplay playsinline></video>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    
    <script>
        // ==================== CONFIGURATION ====================
        const PARTICLE_COUNT = 50000;
        const IMAGE_WIDTH = 512;
        const IMAGE_HEIGHT = 512;
        
        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 300;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // ==================== PARTICLE SYSTEM ====================
        const particleGeometry = new THREE.BufferGeometry();
        
        // Create arrays for particle data
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const randomPositions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositionsA = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositionsB = new Float32Array(PARTICLE_COUNT * 3);
        
        // Initialize random positions and colors
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            
            // Random initial positions
            randomPositions[i3] = (Math.random() - 0.5) * 600;
            randomPositions[i3 + 1] = (Math.random() - 0.5) * 600;
            randomPositions[i3 + 2] = (Math.random() - 0.5) * 200;
            
            // Copy to current positions
            positions[i3] = randomPositions[i3];
            positions[i3 + 1] = randomPositions[i3 + 1];
            positions[i3 + 2] = randomPositions[i3 + 2];
            
            // Red and pink colors
            const isRed = Math.random() > 0.5;
            colors[i3] = isRed ? 1.0 : 1.0;      // R
            colors[i3 + 1] = isRed ? 0.0 : 0.41; // G
            colors[i3 + 2] = isRed ? 0.0 : 0.71; // B
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeometry.setAttribute('randomPosition', new THREE.BufferAttribute(randomPositions, 3));
        particleGeometry.setAttribute('targetA', new THREE.BufferAttribute(targetPositionsA, 3));
        particleGeometry.setAttribute('targetB', new THREE.BufferAttribute(targetPositionsB, 3));
        
        // Vertex Shader - GPU-accelerated particle animation
        const vertexShader = `
            attribute vec3 randomPosition;
            attribute vec3 targetA;
            attribute vec3 targetB;
            attribute vec3 color;
            
            uniform float pinchStrength;
            uniform float dispersionStrength;
            uniform vec3 handCenter;
            uniform float currentImage;
            
            varying vec3 vColor;
            
            void main() {
                vColor = color;
                
                vec3 finalPosition;
                vec3 currentTarget = mix(targetA, targetB, currentImage);
                
                // Blend between random and target based on pinch
                vec3 targetPosition = mix(randomPosition, currentTarget, pinchStrength);
                
                // Dispersion effect when palm is open
                vec3 toParticle = randomPosition - handCenter;
                float distanceToHand = length(toParticle);
                vec3 pushDirection = normalize(toParticle);
                vec3 dispersedPosition = randomPosition + pushDirection * dispersionStrength * 100.0;
                
                // Final position combines pinch pull and dispersion push
                finalPosition = mix(targetPosition, dispersedPosition, dispersionStrength * 0.5);
                
                vec4 mvPosition = modelViewMatrix * vec4(finalPosition, 1.0);
                gl_PointSize = 2.0 * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;
        
        // Fragment Shader
        const fragmentShader = `
            varying vec3 vColor;
            
            void main() {
                // Circular particles
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                
                // Soft glow
                float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
                gl_FragColor = vec4(vColor, alpha);
            }
        `;
        
        const particleMaterial = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                pinchStrength: { value: 0.0 },
                dispersionStrength: { value: 0.0 },
                handCenter: { value: new THREE.Vector3(0, 0, 0) },
                currentImage: { value: 0.0 }
            },
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        
        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);
        
        // ==================== IMAGE LOADING ====================
        function loadImageData(imagePath, targetArray, callback) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = IMAGE_WIDTH;
                canvas.height = IMAGE_HEIGHT;
                const ctx = canvas.getContext('2d');
                
                // Draw and resize image
                ctx.drawImage(img, 0, 0, IMAGE_WIDTH, IMAGE_HEIGHT);
                const imageData = ctx.getImageData(0, 0, IMAGE_WIDTH, IMAGE_HEIGHT);
                
                // Extract pixel positions where image has content
                const pixelPositions = [];
                for (let y = 0; y < IMAGE_HEIGHT; y++) {
                    for (let x = 0; x < IMAGE_WIDTH; x++) {
                        const index = (y * IMAGE_WIDTH + x) * 4;
                        const alpha = imageData.data[index + 3];
                        
                        // Only include pixels that aren't transparent
                        if (alpha > 50) {
                            pixelPositions.push({
                                x: (x - IMAGE_WIDTH / 2) * 0.5,
                                y: -(y - IMAGE_HEIGHT / 2) * 0.5,
                                z: 0
                            });
                        }
                    }
                }
                
                // Map particles to pixel positions
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const pixel = pixelPositions[i % pixelPositions.length];
                    const i3 = i * 3;
                    
                    targetArray[i3] = pixel.x + (Math.random() - 0.5) * 2;
                    targetArray[i3 + 1] = pixel.y + (Math.random() - 0.5) * 2;
                    targetArray[i3 + 2] = pixel.z + (Math.random() - 0.5) * 10;
                }
                
                particleGeometry.attributes.targetA.needsUpdate = true;
                particleGeometry.attributes.targetB.needsUpdate = true;
                
                if (callback) callback();
            };
            
            img.onerror = function() {
                console.error('Failed to load image:', imagePath);
                // Create a simple heart shape as fallback
                createHeartShape(targetArray);
                if (callback) callback();
            };
            
            img.src = imagePath;
        }
        
        // Fallback: Create heart shape
        function createHeartShape(targetArray) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                
                // Parametric heart equation
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                
                targetArray[i3] = x * 8 + (Math.random() - 0.5) * 5;
                targetArray[i3 + 1] = y * 8 + (Math.random() - 0.5) * 5;
                targetArray[i3 + 2] = (Math.random() - 0.5) * 20;
            }
            particleGeometry.attributes.targetA.needsUpdate = true;
            particleGeometry.attributes.targetB.needsUpdate = true;
        }
        
        // Load your images here - replace with actual image URLs
        // For demo purposes, we'll use placeholder URLs or create shapes
        // REPLACE THESE WITH YOUR ACTUAL IMAGE URLS:
        const imageA = 'https://via.placeholder.com/512/ff69b4/ffffff?text=Image+A';
        const imageB = 'https://via.placeholder.com/512/ff1493/ffffff?text=Image+B';
        
        let imagesLoaded = 0;
        function checkImagesLoaded() {
            imagesLoaded++;
            if (imagesLoaded === 2) {
                document.getElementById('loading').classList.add('hidden');
            }
        }
        
        loadImageData(imageA, targetPositionsA, checkImagesLoaded);
        loadImageData(imageB, targetPositionsB, checkImagesLoaded);
        
        // ==================== MEDIAPIPE HANDS SETUP ====================
        let handDetected = false;
        let indexFingerTip = { x: 0, y: 0, z: 0 };
        let thumbTip = { x: 0, y: 0, z: 0 };
        
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onHandResults);
        
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Index finger tip is landmark 8
                // Thumb tip is landmark 4
                const indexTip = landmarks[8];
                const thumbTipLandmark = landmarks[4];
                
                // Convert normalized coordinates to 3D space
                indexFingerTip = {
                    x: (indexTip.x - 0.5) * 600,
                    y: -(indexTip.y - 0.5) * 450,
                    z: -indexTip.z * 200
                };
                
                thumbTip = {
                    x: (thumbTipLandmark.x - 0.5) * 600,
                    y: -(thumbTipLandmark.y - 0.5) * 450,
                    z: -thumbTipLandmark.z * 200
                };
                
                handDetected = true;
            } else {
                handDetected = false;
            }
        }
        
        // Setup camera
        const videoElement = document.getElementById('video');
        const camera_utils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera_utils.start();
        
        // ==================== ANIMATION LOOP ====================
        let targetPinchStrength = 0.0;
        let currentPinchStrength = 0.0;
        let targetDispersionStrength = 0.0;
        let currentDispersionStrength = 0.0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (handDetected) {
                // Calculate distance between index finger and thumb
                const dx = indexFingerTip.x - thumbTip.x;
                const dy = indexFingerTip.y - thumbTip.y;
                const dz = indexFingerTip.z - thumbTip.z;
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
                
                // Normalize distance (adjust these values based on testing)
                const maxDistance = 200;
                const minDistance = 20;
                const normalizedDistance = Math.max(0, Math.min(1, (distance - minDistance) / (maxDistance - minDistance)));
                
                // Pinch strength is inverse of distance
                targetPinchStrength = 1.0 - normalizedDistance;
                
                // Dispersion strength increases with distance
                targetDispersionStrength = normalizedDistance;
                
                // Hand center for dispersion effect
                particleMaterial.uniforms.handCenter.value.set(
                    (indexFingerTip.x + thumbTip.x) / 2,
                    (indexFingerTip.y + thumbTip.y) / 2,
                    (indexFingerTip.z + thumbTip.z) / 2
                );
            } else {
                // No hand detected, return to random state
                targetPinchStrength = 0.0;
                targetDispersionStrength = 0.0;
            }
            
            // Smooth interpolation for natural movement
            currentPinchStrength += (targetPinchStrength - currentPinchStrength) * 0.1;
            currentDispersionStrength += (targetDispersionStrength - currentDispersionStrength) * 0.1;
            
            particleMaterial.uniforms.pinchStrength.value = currentPinchStrength;
            particleMaterial.uniforms.dispersionStrength.value = currentDispersionStrength;
            
            // Rotate particle system slightly for visual interest
            particleSystem.rotation.y += 0.0005;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // ==================== WINDOW RESIZE ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ==================== OPTIONAL: SWITCH BETWEEN IMAGES ====================
        // You can add keyboard controls to switch between images
        window.addEventListener('keypress', (e) => {
            if (e.key === '1') {
                particleMaterial.uniforms.currentImage.value = 0.0;
            } else if (e.key === '2') {
                particleMaterial.uniforms.currentImage.value = 1.0;
            }
        });
    </script>
</body>
</html>
